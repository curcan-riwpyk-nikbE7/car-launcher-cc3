org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
# Компилировать Kotlin в том же процессе: на слабых машинах отдельный
# демон Kotlin не влезает в память. В Android Studio можно убрать.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=false
