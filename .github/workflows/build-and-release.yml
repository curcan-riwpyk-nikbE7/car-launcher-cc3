name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-action
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Signing Keystores and AOSP Keys
        run: |
          mkdir -p keys
          # Generate temporary JKS files for Gradle validation
          keytool -genkeypair -alias testkey -keypass android -keystore keys/testkey.jks -storepass android -dname "CN=Android,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          keytool -genkeypair -alias platform -keypass android -keystore platform.jks -storepass android -dname "CN=Android,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          keytool -genkeypair -alias carlauncher -keypass carlauncher -keystore carlauncher.jks -storepass carlauncher -dname "CN=CarLauncher,O=CarLauncher,C=US" -keyalg RSA -keysize 2048 -validity 10000

          # Download official standard AOSP platform and testkey keys
          curl -s -L https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o keys/testkey.pk8
          curl -s -L https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o keys/testkey.x509.pem
          curl -s -L https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.pk8 -o keys/platform.pk8
          curl -s -L https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.x509.pem -o keys/platform.x509.pem

      - name: Build Hidden API Stub JAR
        run: |
          mkdir -p stub-out
          mkdir -p app/libs
          javac -cp ${ANDROID_HOME}/platforms/android-34/android.jar -d stub-out app/src/main/stub/android/app/ActivityView.java
          jar cf app/libs/framework-stub.jar -C stub-out .

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew :app:assembleAospRelease :app:assembleAospuidRelease --stacktrace

      - name: Sign APKs with official AOSP keys
        run: |
          BUILD_TOOLS_DIR=$(find ${ANDROID_HOME}/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using build tools from $BUILD_TOOLS_DIR"
          
          # Align and sign KINGSAID-TESTKEY.apk
          RAW_TESTKEY=$(ls app/build/outputs/apk/aosp/release/*.apk | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_TESTKEY" aligned_testkey.apk
          $BUILD_TOOLS_DIR/apksigner sign --key keys/testkey.pk8 --cert keys/testkey.x509.pem --v1-signing-enabled true --v2-signing-enabled true --out KINGSAID-TESTKEY.apk aligned_testkey.apk

          # Align and sign KINGSAID-PIP.apk
          RAW_PIP=$(ls app/build/outputs/apk/aospuid/release/*.apk | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_PIP" aligned_pip.apk
          $BUILD_TOOLS_DIR/apksigner sign --key keys/platform.pk8 --cert keys/platform.x509.pem --v1-signing-enabled true --v2-signing-enabled true --out KINGSAID-PIP.apk aligned_pip.apk

          # Verify certificates
          $BUILD_TOOLS_DIR/apksigner verify --print-certs KINGSAID-TESTKEY.apk
          $BUILD_TOOLS_DIR/apksigner verify --print-certs KINGSAID-PIP.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncher-v7.0-APKs
          path: |
            KINGSAID-TESTKEY.apk
            KINGSAID-PIP.apk

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} - Полноценное встраивание ActivityView (LecoAuto/DriveDeck)"
          body: |
            ## Релиз ${{ github.ref_name }}
            
            - **Встроенные приложения в карточке через ActivityView (LecoAuto/DriveDeck):**
              - Переход с ненадежного VirtualDisplay на официальный системный компонент Android 10 `android.app.ActivityView`.
              - Аппаратно-ускоренный рендеринг Яндекс Карт / Яндекс Навигатора / YouTube прямо внутри скругленной карточки.
              - Никаких всплывающих свободных окон, рамок заголовков и системных кнопок [ 🗖 ] [ ✕ ].
              - Полная поддержка нативных тач-жестов (зум, перемещение карты) средствами AOSP InputDispatcher.
              - Прямой запуск через LaunchIntent (устранена проблема Trampoline/Router-активностей, сбрасывавшихся в черный экран).
            
            ## Файлы
            - `KINGSAID-PIP.apk` - рекомендуемая сборка с ключом платформы и системными правами
            - `KINGSAID-TESTKEY.apk` - сборка с ключом test-keys
          files: |
            KINGSAID-TESTKEY.apk
            KINGSAID-PIP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
